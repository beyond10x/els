format: protocol/1

protocol:
  id: software.change.bugfix
  revision: 1
  description: >
    software.change/1 with red-first ordering for a bugfix: a new test must fail before the
    implementation may change, then the suite must pass. Preview of the future `bugfix` profile;
    Canon has no profiles yet, so this is written as its own protocol.

artifacts:
  implementation:
    description: The code change, at one revision.

evidence_kinds:
  test_result:
    description: The outcome of the test suite run against the implementation; failed or passed.
  code_review:
    description: A review by someone other than the author; approved or changes_requested.

claims:
  regression.reproduced:
    description: A new test reproduces the bug, so the suite is red before any fix.
    true_when:
      evidence:
        kind: test_result
        result: failed

  tests.pass:
    description: The suite is green after the fix.
    true_when:
      evidence:
        kind: test_result
        result: passed

  implementation.reviewed:
    description: Someone other than the author approved the fix.
    true_when:
      evidence:
        kind: code_review
        result: approved

  implementation.verified:
    description: Red first, then green, then reviewed.
    true_when:
      all:
        - claim: regression.reproduced
        - claim: tests.pass
        - claim: implementation.reviewed

actions:
  repository.inspect:
    description: Read the repository.
    effect: read

  tests.write:
    description: Add or change tests only. Always allowed.
    effect: write
    requires:
      - capability: tests.write

  tests.run:
    description: Run the suite.
    effect: execute
    may_produce:
      - evidence: test_result

  implementation.edit:
    description: Change the implementation. Blocked until a failing test exists.
    effect: write
    precondition:
      claim: regression.reproduced
    requires:
      - capability: implementation.write

  repository.merge:
    description: Merge the verified fix. Needs authority.
    effect: write
    precondition:
      claim: implementation.verified
    requires:
      - capability: repository.merge

outcomes:
  fixed:
    description: Reproduced, fixed, green and reviewed.
    requires:
      claim: implementation.verified
