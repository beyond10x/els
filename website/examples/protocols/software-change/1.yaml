format: protocol/1

protocol:
  id: software.change
  revision: 1
  description: >
    Ship a change to a system: implement it, prove it on the current revision, release it,
    deploy it, and confirm it achieved what it was meant to.

artifacts:
  intent:
    description: What the change is meant to achieve.
  system_specification:
    description: The specified behaviour of the system concerned.
  plan:
    description: The intended steps toward the intent.
  implementation:
    description: The code change, at one revision.
  release:
    description: A versioned, deployable unit built from the implementation.
  deployment:
    description: The release running in an environment.

evidence_kinds:
  test_result:
    description: The outcome of the test suite run against the implementation; passed or failed.
  coverage_report:
    description: >
      Test coverage of the implementation compared with its base; not_degraded or degraded.
  code_review:
    description: A review of the implementation by someone other than its author; approved or changes_requested.
  build_provenance:
    description: How the release was built and from what; reproducible or not_reproducible.
  operational_observation:
    description: A health reading of the deployment; healthy or degraded.
  objective_observation:
    description: An observation of whether the intent was achieved; realized or not_realized.

claims:
  tests.pass:
    description: The test suite passes on the implementation.
    true_when:
      evidence:
        kind: test_result
        result: passed

  coverage.not_degraded:
    description: Test coverage did not fall compared with the base.
    true_when:
      evidence:
        kind: coverage_report
        result: not_degraded

  implementation.reviewed:
    description: Someone other than the author approved the implementation.
    true_when:
      evidence:
        kind: code_review
        result: approved

  implementation.verified:
    description: Tested, reviewed and not reducing coverage. This is the merge gate.
    true_when:
      all:
        - claim: tests.pass
        - claim: coverage.not_degraded
        - claim: implementation.reviewed

  release.proven:
    description: The release is built reproducibly from a verified implementation.
    true_when:
      all:
        - claim: implementation.verified
        - evidence:
            kind: build_provenance
            result: reproducible

  deployment.healthy:
    description: The deployment is healthy.
    true_when:
      evidence:
        kind: operational_observation
        result: healthy

  objective.realized:
    description: The change achieved its intent.
    true_when:
      evidence:
        kind: objective_observation
        result: realized

actions:
  repository.inspect:
    description: Read the repository.
    effect: read

  repository.edit:
    description: Change the implementation on a branch.
    effect: write
    requires:
      - capability: repository.write

  tests.run:
    description: Run the test suite with coverage against the implementation.
    effect: execute
    may_produce:
      - evidence: test_result
      - evidence: coverage_report

  repository.merge:
    description: Merge the verified implementation. Needs authority; an agent's run usually stops here.
    effect: write
    precondition:
      claim: implementation.verified
    requires:
      - capability: repository.merge

outcomes:
  accepted:
    description: Released, deployed, healthy and achieving its intent.
    requires:
      all:
        - claim: release.proven
        - claim: deployment.healthy
        - claim: objective.realized
