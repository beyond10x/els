[package]
name = "b10x-canon-engineering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "canon_engineering"
path = "src/lib.rs"

[[bin]]
name = "canon-engineering"
path = "src/main.rs"

[dependencies]
b10x-canon = { git = "https://github.com/beyond10x/canon", branch = "main" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
serde_json = "1"
