format: protocol/1

protocol:
  id: incident.response
  revision: 1
  description: >-
    Respond to an incident: restore the service and leave emergency mode on restoration evidence,
    while the investigation of its cause progresses on its own.

artifacts:
  service:
    description: the running service a case concerns
  release:
    description: a versioned, deployable unit of the system

evidence_kinds:
  impact_assessment:
    description: an assessment of who and what an incident affects
  operational_observation:
    description: an observation of the running system; its result is healthy or unhealthy
  cause_analysis:
    description: an analysis of why an incident happened

claims:
  impact.bounded:
    description: the incident's impact is known and contained
    true_when:
      evidence:
        kind: impact_assessment
        result: bounded
        subject: service
  service.healthy:
    description: the service is running healthily
    true_when:
      evidence:
        kind: operational_observation
        result: healthy
        subject: service
  cause.identified:
    description: the incident's cause is known
    true_when:
      evidence:
        kind: cause_analysis
        result: identified

obligations:
  restore_service:
    description: urgent; bring the affected service back to health
    discharged_when:
      claim: service.healthy
      is: true

actions:
  metrics.inspect:
    description: read the system's metrics
    effect: read
    may_produce:
      - evidence: operational_observation
      - evidence: impact_assessment
  logs.search:
    description: search the system's logs
    effect: read
    may_produce:
      - evidence: cause_analysis
  release.inspect:
    description: read what a release contains
    effect: read
    may_produce:
      - evidence: cause_analysis
  traffic.shift:
    description: move traffic between deployments
    effect: write
    requires:
      - capability: traffic.shift
  release.rollback:
    description: return to a previous release
    effect: write
    requires:
      - capability: release.rollback
  emergency.leave:
    description: >-
      leave emergency mode; admissible once restore_service is discharged and the impact is
      bounded, whatever is known of the cause
    precondition:
      all:
        - claim: service.healthy
          is: true
        - claim: impact.bounded
          is: true
